appId: org.dtio.typeeditor
productName: Type Editor
copyright: Copyright © Datatype Team
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    # An installer for the usual case, and a portable zip for anyone whose
    # machine refuses to run an unsigned installer at all.
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Type Editor
  artifactName: ${productName}-${version}-setup.${ext}
  include: build/installer.nsh
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Office
