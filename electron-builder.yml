appId: org.dtio.typeeditor
productName: Type Editor
copyright: Copyright © Datatype Team
publisherName: Datatype Team
homepage: https://dtio.org
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    # An installer for the usual case, and a portable zip for anyone whose
    # machine refuses to run an unsigned installer at all.
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Signing is configured entirely through the environment: set CSC_LINK and
  # CSC_KEY_PASSWORD and the same build produces a signed installer. See the
  # README for what is and is not possible without a certificate.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Type Editor
  artifactName: ${productName}-${version}-setup.${ext}
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Office
